<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal</title>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/portal.js"></script>
</head>
<body>
  <div class="support-banner" id="support-banner" hidden>Você está no modo suporte: vê todos os relatórios deste cliente, e seus acessos ficam registrados como suporte.</div>
  <header class="topbar">
    <a class="topbar-brand" href="/"><img data-brand-logo hidden alt=""><span data-brand-name></span></a>
    <input type="search" class="topbar-search" id="search" placeholder="Buscar relatório..." aria-label="Buscar relatório">
    <div class="topbar-actions" id="user-menu"></div>
  </header>
  <main class="page" id="home" aria-live="polite">
    <p class="muted">Carregando...</p>
  </main>
  <section class="viewer" id="viewer" hidden aria-label="Relatório">
    <div class="viewer-bar">
      <button type="button" class="btn-ghost" id="viewer-back">← Voltar</button>
      <span class="viewer-title" id="viewer-title"></span>
      <button type="button" class="btn-ghost viewer-fav" id="viewer-fav" title="Favorito" aria-label="Favorito">☆</button>
      <button type="button" id="viewer-full">Tela cheia</button>
    </div>
    <div class="viewer-status" id="viewer-status" hidden></div>
    <iframe class="viewer-frame" id="viewer-frame" title="Relatório" allowfullscreen referrerpolicy="no-referrer" hidden></iframe>
  </section>
</body>
</html>
