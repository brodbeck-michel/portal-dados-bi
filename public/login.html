<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar</title>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/login.js"></script>
</head>
<body data-mode="tenant">
  <main class="auth-page">
    <form class="auth-card" id="login-form" novalidate>
      <div class="auth-brand">
        <img data-brand-logo hidden alt="">
        <h1 data-brand-name></h1>
        <p class="muted small">Entre com seu e-mail e senha</p>
      </div>
      <div class="alert alert-error" id="login-error" hidden></div>
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary">Entrar</button>
      <p class="muted small">Esqueceu a senha? Fale com o administrador do portal.</p>
    </form>
  </main>
  <p class="product-foot">Portal de Dados BI</p>
</body>
</html>
